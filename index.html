<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinusoidal Grating — Contrast &amp; Spatiotemporal Gradients</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="header">
      <h1>Gratings</h1>
      <p class="subtitle">Spatial &amp; Temporal Gradients</p>
    </div>

    <!-- Strip Geometry & Contrast -->
    <div class="control-group">
      <label for="stripHeight">
        <span class="label-text">Strip Height</span>
        <span class="val-text" id="stripHeightVal">20 px</span>
      </label>
      <input type="range" id="stripHeight" />
    </div>

    <div class="control-group">
      <label for="maxContrast">
        <span class="label-text">Max Contrast (Bottom)</span>
        <span class="val-text" id="maxContrastVal">1.00</span>
      </label>
      <input type="range" id="maxContrast" />
    </div>

    <div class="control-group">
      <label for="contrastScale">
        <span class="label-text">Contrast Spacing</span>
      </label>
      <select id="contrastScale">
        <option value="linear" selected>Linear</option>
        <option value="logarithmic">Logarithmic</option>
      </select>
    </div>

    <hr class="divider" />

    <!-- Spatial Frequency Gradient -->
    <div class="control-group">
      <label for="minSpatialFreqCpd">
        <span class="label-text">Min Spatial Freq (Left)</span>
        <span class="val-text" id="minSpatialFreqCpdVal">0.06 cpd</span>
      </label>
      <input type="range" id="minSpatialFreqCpd" />
    </div>

    <div class="control-group">
      <label for="deltaSpatialFreqCpd">
        <span class="label-text">Spatial Freq Range (Max − Min)</span>
        <span class="val-text" id="deltaSpatialFreqCpdVal">2.0 cpd</span>
      </label>
      <input type="range" id="deltaSpatialFreqCpd" />
    </div>

    <div class="control-group">
      <label for="spatialFreqScale">
        <span class="label-text">Spatial Freq Spacing</span>
      </label>
      <select id="spatialFreqScale">
        <option value="linear" selected>Linear</option>
        <option value="logarithmic">Logarithmic</option>
      </select>
    </div>

    <!-- Viewing Geometry -->
    <div class="control-group">
      <label for="viewingDistanceCm">
        <span class="label-text">Viewing Distance</span>
        <span class="val-text" id="viewingDistanceCmVal">57 cm</span>
      </label>
      <input type="range" id="viewingDistanceCm" />
    </div>

    <div class="control-group">
      <label for="gratingWidthCm">
        <span class="label-text">Grating Width (Screen)</span>
        <span class="val-text" id="gratingWidthCmVal">30 cm</span>
      </label>
      <input type="range" id="gratingWidthCm" />
    </div>

    <hr class="divider" />

    <!-- Temporal Frequency Gradient -->
    <div class="control-group">
      <label for="minTemporalFreq">
        <span class="label-text">Min Temporal Freq (Left)</span>
        <span class="val-text" id="minTemporalFreqVal">0.0 Hz</span>
      </label>
      <input type="range" id="minTemporalFreq" />
    </div>

    <div class="control-group">
      <label for="deltaTemporalFreq">
        <span class="label-text">Temporal Freq Range (Max − Min)</span>
        <span class="val-text" id="deltaTemporalFreqVal">0.0 Hz</span>
      </label>
      <input type="range" id="deltaTemporalFreq" />
    </div>

    <div class="control-group">
      <label for="temporalFreqScale">
        <span class="label-text">Temporal Freq Spacing</span>
      </label>
      <select id="temporalFreqScale">
        <option value="linear" selected>Linear</option>
        <option value="logarithmic">Logarithmic</option>
      </select>
    </div>

    <hr class="divider" />

    <!-- Monitor Gamma / Exponent -->
    <div class="control-group">
      <label for="gamma">
        <span class="label-text">RGB-&gt;luminance exponent (gamma)</span>
        <span class="val-text" id="gammaVal">2.20</span>
      </label>
      <input type="range" id="gamma" />
    </div>

    <!-- Info Card -->
    <div class="info-card">
      <div class="info-row">
        <span>Strips visible:</span>
        <strong id="infoStripCount">-</strong>
      </div>
      <div class="info-row">
        <span>Top strip contrast:</span>
        <strong id="infoTopContrast">0.00</strong>
      </div>
      <div class="info-row">
        <span id="infoContrastLabel">Contrast step (auto):</span>
        <strong id="infoContrastStep">-</strong>
      </div>
    </div>

    <button id="resetBtn" type="button">Reset to Defaults</button>
  </aside>

  <main id="canvasContainer">
    <canvas id="gratingCanvas"></canvas>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
